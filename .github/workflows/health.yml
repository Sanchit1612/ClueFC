name: live-health
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public game and run bounded expired-record maintenance
        run: |
          node --input-type=module <<'JS'
          const url = 'https://clue-fc-matchday.moistcrown2.chatgpt.site/health';
          const response = await fetch(url, {signal: AbortSignal.timeout(30000)});
          if (!response.ok) throw Error(`Game health failed: ${response.status}`);
          const data = await response.json();
          if (!data.ok || !data.storage) throw Error('Game storage is unavailable');
          console.log('Public game and database are healthy.');
          JS
